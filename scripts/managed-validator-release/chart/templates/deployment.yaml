apiVersion: apps/v1
kind: Deployment
metadata:
  name: cats-validator-self-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cats-validator-self-test
  template:
    metadata:
      labels:
        app: cats-validator-self-test
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ready
          image: SELF_TEST_IMAGE
          imagePullPolicy: Never
          ports:
            - name: health
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 16Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 10
