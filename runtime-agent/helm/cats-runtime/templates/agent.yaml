{{- $url := required "Set catsUrl to the IP address or HTTPS URL of the CATS portal" .Values.catsUrl -}}
{{- $authority := "([[:alnum:]][[:alnum:].-]*|\\[[[:xdigit:]:.]+\\])(:[0-9]{1,5})?" -}}
{{- if regexMatch (printf "^%s$" $authority) $url -}}
{{- $url = printf "https://%s" $url -}}
{{- end -}}
{{- if not (regexMatch (printf "^https://%s(/[^?#[:space:]]*)?$" $authority) $url) -}}
{{- fail "catsUrl must be an HTTPS portal URL without credentials, query parameters or a fragment" -}}
{{- end -}}
{{- $key := trim .Values.linkingKey -}}
{{- if and $key .Values.linkingKeySecret -}}
{{- fail "Choose either linkingKey or linkingKeySecret" -}}
{{- end -}}
{{- if and .Release.IsInstall (not $key) (not .Values.linkingKeySecret) (not .Values.persistence.existingClaim) -}}
{{- fail "Set linkingKey or linkingKeySecret to enroll a new agent" -}}
{{- end -}}
{{- if and .Values.image.digest (not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.image.digest)) -}}
{{- fail "image.digest must be a sha256 manifest digest" -}}
{{- end -}}
{{- $linkSecret := .Values.linkingKeySecret -}}
{{- if $key -}}
{{- $linkSecret = printf "%s-link" .Release.Name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $linkSecret | quote }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  linking-key: {{ $key | b64enc | quote }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ .Release.Name }}
---
{{- if not .Values.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-state
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cats-runtime
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cats-runtime
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      enableServiceLinks: false
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: collector
          {{- if .Values.image.digest }}
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s:%s" .Values.image.repository (default .Chart.AppVersion .Values.image.tag) | quote }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run", "--source", "kubernetes", "--state-dir", "/var/lib/cats-runtime/state"]
          env:
            - name: CATS_URL
              value: {{ $url | quote }}
            - name: CATS_AGENT_NAME
              value: {{ default .Release.Name .Values.agentName | quote }}
            {{- if $linkSecret }}
            - name: CATS_LINKING_KEY_FILE
              value: /run/cats-link/linking-key
            {{- end }}
            {{- if .Values.caSecret }}
            - name: CATS_CA_FILE
              value: /run/cats-ca/ca.crt
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import json, pathlib, sys
                  path = pathlib.Path("/var/lib/cats-runtime/state/state.json")
                  sys.exit(0 if path.is_file() and json.loads(path.read_bytes()).get("agent_id") else 1)
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/cats-runtime
            {{- if $linkSecret }}
            - name: link
              mountPath: /run/cats-link
              readOnly: true
            {{- end }}
            {{- if .Values.caSecret }}
            - name: ca
              mountPath: /run/cats-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-state" .Release.Name) .Values.persistence.existingClaim }}
        {{- if $linkSecret }}
        - name: link
          secret:
            secretName: {{ $linkSecret | quote }}
            optional: true
            defaultMode: 0440
            items:
              - key: linking-key
                path: linking-key
        {{- end }}
        {{- if .Values.caSecret }}
        - name: ca
          secret:
            secretName: {{ .Values.caSecret | quote }}
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
