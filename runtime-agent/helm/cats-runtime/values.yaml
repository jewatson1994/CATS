# An HTTPS portal URL or a host/IP with optional port. Bare addresses use HTTPS.
catsUrl: ""
# Defaults to the Helm release name.
agentName: ""
# Use exactly one bootstrap source for a new agent.
# Inline keys are stored in Helm release history. Prefer an existing Secret
# (key: linking-key) when credentials must be managed outside Helm.
linkingKey: ""
linkingKeySecret: ""
# Optional existing Secret containing ca.crt for the CATS endpoint.
caSecret: ""
image:
  # Use the same fully qualified image:tag or image@sha256:digest as CATS_IMAGE in Compose.
  reference: ""
  repository: ghcr.io/jewatson1994/cats-tool
  # An explicit digest takes priority over tag. Published charts pin the shared image index.
  # A source checkout uses the shared latest tag when neither value is supplied.
  tag: ""
  digest: ""
  # Kubernetes defaults to Always for latest and IfNotPresent for a digest or other tag.
  pullPolicy: ""
imagePullSecrets: []
persistence:
  existingClaim: ""
  size: 1Gi
  storageClass: ""
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
