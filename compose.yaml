name: cats

# Canonical CATS runtime. Run from the repository root with:
#   docker compose up -d --wait
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cats}
      POSTGRES_USER: ${POSTGRES_USER:-cats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.3}
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    restart: unless-stopped

  patch-worker:
    image: ${CATS_IMAGE:-cats:1.2.1}
    command: ["uvicorn", "app.patch_service:app", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      CATS_PATCH_JOB_ROOT: /tmp/cats-patch-jobs
      CATS_PATCH_WORKER_TOKEN: ${CATS_PATCH_WORKER_TOKEN:?Set CATS_PATCH_WORKER_TOKEN in .env}
      CATS_CONFIG_ENCRYPTION_KEY: ${CATS_CONFIG_ENCRYPTION_KEY:?Set CATS_CONFIG_ENCRYPTION_KEY in .env}
      CATS_PATCH_COMMAND_TIMEOUT: ${CATS_PATCH_COMMAND_TIMEOUT:-1800}
      CATS_COPA_TIMEOUT: ${CATS_COPA_TIMEOUT:-30m}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - patch_jobs:/tmp/cats-patch-jobs
    healthcheck:
      test: ["CMD", "/opt/cats-venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  portal:
    image: ${CATS_IMAGE:-cats:1.2.1}
    environment:
      # Keep the password out of the URI. Psycopg reads PGPASSWORD directly,
      # including passwords containing URI-reserved characters.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cats}@db:5432/${POSTGRES_DB:-cats}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CATS_BOOTSTRAP_USERNAME: ${CATS_BOOTSTRAP_USERNAME:-admin}
      CATS_BOOTSTRAP_PASSWORD: ${CATS_BOOTSTRAP_PASSWORD:?Set CATS_BOOTSTRAP_PASSWORD in .env}
      CATS_ENV: ${CATS_ENV:-production}
      CATS_DEV_AUTH_BYPASS: ${CATS_DEV_AUTH_BYPASS:-false}
      CATS_DEV_USER: ${CATS_DEV_USER:-admin}
      CATS_IDENTITY_MODE: ${CATS_IDENTITY_MODE:-local}
      CATS_CONFIG_ENCRYPTION_KEY: ${CATS_CONFIG_ENCRYPTION_KEY:?Set CATS_CONFIG_ENCRYPTION_KEY in .env}
      PIPELINE_API_TOKEN: ${PIPELINE_API_TOKEN:?Set PIPELINE_API_TOKEN in .env}
      ALLOW_SERVICE_DELETE: ${ALLOW_SERVICE_DELETE:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      CATS_PATCH_WORKER_URL: http://patch-worker:8010
      CATS_PATCH_WORKER_TOKEN: ${CATS_PATCH_WORKER_TOKEN:?Set CATS_PATCH_WORKER_TOKEN in .env}
      CATS_PATCH_JOB_ROOT: /tmp/cats-patch-jobs
      CATS_PATCH_JOB_TIMEOUT: ${CATS_PATCH_JOB_TIMEOUT:-3600}
      CATS_PATCH_COMMAND_TIMEOUT: ${CATS_PATCH_COMMAND_TIMEOUT:-1800}
      CATS_COPA_TIMEOUT: ${CATS_COPA_TIMEOUT:-30m}
      CATS_SCANNER_RUNNER: ${CATS_SCANNER_RUNNER:-/usr/local/bin/cats-scan}
      CATS_PUBLIC_JOB_ROOT: /tmp/cats-public-jobs
      CATS_PUBLIC_JOB_TIMEOUT: ${CATS_PUBLIC_JOB_TIMEOUT:-3600}
      TRIVY_IMAGE_CONFIG_SCAN_ENABLED: ${TRIVY_IMAGE_CONFIG_SCAN_ENABLED:-true}
      DOCKLE_IMAGE_CONFIG_SCAN_ENABLED: ${DOCKLE_IMAGE_CONFIG_SCAN_ENABLED:-true}
      CATS_OIDC_ALLOW_INSECURE_HTTP: ${CATS_OIDC_ALLOW_INSECURE_HTTP:-false}
      CATS_OIDC_ISSUER_URL: ${CATS_OIDC_ISSUER_URL:-}
      CATS_OIDC_BROWSER_ISSUER_URL: ${CATS_OIDC_BROWSER_ISSUER_URL:-}
      CATS_OIDC_CLIENT_ID: ${CATS_OIDC_CLIENT_ID:-}
      CATS_OIDC_CLIENT_SECRET: ${CATS_OIDC_CLIENT_SECRET:-}
      CATS_OIDC_REDIRECT_URI: ${CATS_OIDC_REDIRECT_URI:-}
      CATS_OIDC_POST_LOGOUT_REDIRECT_URI: ${CATS_OIDC_POST_LOGOUT_REDIRECT_URI:-}
      CATS_OIDC_SCOPES: ${CATS_OIDC_SCOPES:-openid profile email groups}
      CATS_OIDC_GROUPS_CLAIM: ${CATS_OIDC_GROUPS_CLAIM:-groups}
      CATS_OIDC_ROLES_CLAIM: ${CATS_OIDC_ROLES_CLAIM:-realm_access.roles}
      CATS_OIDC_ROLE_MAP: ${CATS_OIDC_ROLE_MAP:-{}}
      CATS_OIDC_GROUP_ROLE_MAP: ${CATS_OIDC_GROUP_ROLE_MAP:-{}}
      CATS_OIDC_DEFAULT_ROLE: ${CATS_OIDC_DEFAULT_ROLE:-}
      CATS_OIDC_GROUP_DEFAULT_ROLE: ${CATS_OIDC_GROUP_DEFAULT_ROLE:-Service Manager}
      CATS_OIDC_AUTO_PROVISION: ${CATS_OIDC_AUTO_PROVISION:-true}
      CATS_OIDC_AUTO_PROVISION_GROUPS: ${CATS_OIDC_AUTO_PROVISION_GROUPS:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - patch_jobs:/tmp/cats-patch-jobs
      - public_jobs:/tmp/cats-public-jobs
    ports:
      - "${CATS_PORT:-8080}:8000"
    depends_on:
      db:
        condition: service_healthy
      patch-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/cats-venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  patch_jobs:
  public_jobs:
