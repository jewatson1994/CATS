{% extends "base.html" %}
{% block title %}Change password · CATS{% endblock %}
{% block content %}<section class="auth-card"><h1>Change password</h1><p>Use at least 14 characters.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Current password<input type="password" name="current_password" required></label><label>New password<input type="password" name="new_password" minlength="14" required></label><label>Confirm new password<input type="password" name="confirmation" minlength="14" required></label><button>Update password</button></form></section>{% endblock %}
