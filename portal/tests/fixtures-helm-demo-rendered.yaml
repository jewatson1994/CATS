  template:
    metadata:
      labels:
        app.kubernetes.io/name: helm-diagram-demo
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          ports:
            - name: redis
              containerPort: 6379
