# Source: helm-diagram-demo/templates/worker.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-diagram-demo-worker
  labels:
    app.kubernetes.io/name: helm-diagram-demo
    app.kubernetes.io/instance: demo
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: helm-diagram-demo
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helm-diagram-demo
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: helm-diagram-demo-worker
      containers:
        - name: worker
          image: ghcr.io/example/catalog-worker:2.4.1
          envFrom:
            - configMapRef:
                name: helm-diagram-demo-config
---
# Source: helm-diagram-demo/templates/api.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: helm-diagram-demo-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: helm-diagram-demo-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# Source: helm-diagram-demo/templates/data.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: helm-diagram-demo-postgres
  labels:
    app.kubernetes.io/name: helm-diagram-demo
    app.kubernetes.io/instance: demo
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: database
spec:
  serviceName: helm-diagram-demo-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: helm-diagram-demo
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helm-diagram-demo
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: helm-diagram-demo-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
# Source: helm-diagram-demo/templates/worker.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: helm-diagram-demo-cleanup
  labels:
    app.kubernetes.io/name: helm-diagram-demo
    app.kubernetes.io/instance: demo
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: worker
spec:
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: helm-diagram-demo
            app.kubernetes.io/component: cleanup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: ghcr.io/example/catalog-worker:2.4.1
              command: ["/bin/sh", "-c", "echo cleanup"]
---
# Source: helm-diagram-demo/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helm-diagram-demo
  labels:
    app.kubernetes.io/name: helm-diagram-demo
    app.kubernetes.io/instance: demo
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  rules:
    - host: catalog.demo.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: helm-diagram-demo-frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: helm-diagram-demo-api
                port:
                  number: 8080
