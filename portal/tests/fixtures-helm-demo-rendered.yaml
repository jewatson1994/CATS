# Source: helm-diagram-demo/templates/frontend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-diagram-demo-frontend
  labels:
    app.kubernetes.io/name: helm-diagram-demo
    app.kubernetes.io/instance: demo
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: helm-diagram-demo
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helm-diagram-demo
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: nginx:1.27-alpine
