# Source: helm-diagram-demo/templates/api.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-diagram-demo-api
  labels:
    app.kubernetes.io/name: helm-diagram-demo
    app.kubernetes.io/instance: demo
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: helm-diagram-demo
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helm-diagram-demo
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/catalog-api:2.4.1
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: helm-diagram-demo-config
            - secretRef:
                name: helm-diagram-demo-credentials
---
