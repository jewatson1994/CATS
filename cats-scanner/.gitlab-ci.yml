stages:
  - build

variables:
  CATSCAN_IMAGE: "$CI_REGISTRY_IMAGE"
  TRIVY_VERSION: "0.69.3"
  TRIVY_SHA256: "1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75"
  DOCKLE_VERSION: "0.4.15"
  DOCKLE_SHA256: "8bfc9183d1d3d67800edb45bea4bb63ddf1d28bec5f89944075a07007d79caad"
  HELM_VERSION: "4.2.3"
  HELM_SHA256: "e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c"

build_cats_scanner:
  stage: build
  image: docker:27-cli
  script:
    - REGISTRY_HOST="${CATS_REGISTRY:-${CI_REGISTRY:-}}"
    - REGISTRY_USER="${CATS_REGISTRY_USERNAME:-${CI_REGISTRY_USER:-}}"
    - REGISTRY_PASS="${CATS_REGISTRY_PASSWORD:-${CI_REGISTRY_PASSWORD:-}}"
    - test -n "$REGISTRY_HOST" || { echo "A container registry host is required." >&2; exit 1; }
    - test -n "$REGISTRY_USER" || { echo "A container registry username is required." >&2; exit 1; }
    - test -n "$REGISTRY_PASS" || { echo "A container registry password or token is required." >&2; exit 1; }
    - echo "$REGISTRY_PASS" | docker login "$REGISTRY_HOST" --username "$REGISTRY_USER" --password-stdin
    - VERSION_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build --pull=false --build-arg BASE_IMAGE="${CATSCAN_BASE_IMAGE:-alpine:3.22}" --build-arg CATS_SCANNER_VERSION="$VERSION_TAG" --build-arg TRIVY_VERSION="$TRIVY_VERSION" --build-arg TRIVY_SHA256="$TRIVY_SHA256" --build-arg DOCKLE_VERSION="$DOCKLE_VERSION" --build-arg DOCKLE_SHA256="$DOCKLE_SHA256" --build-arg HELM_VERSION="$HELM_VERSION" --build-arg HELM_SHA256="$HELM_SHA256" -t "$CATSCAN_IMAGE:$VERSION_TAG" -t "$CATSCAN_IMAGE:latest" .
    - docker run --rm "$CATSCAN_IMAGE:$VERSION_TAG" /usr/local/bin/catscan-self-test
    - docker push "$CATSCAN_IMAGE:$VERSION_TAG"
    - docker push "$CATSCAN_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
