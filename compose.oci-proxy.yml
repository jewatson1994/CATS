# Optional read-only OCI facade. Requires the canonical compose.yaml.
# docker compose -f compose.yaml -f compose.oci-proxy.yml up -d oci-proxy
services:
  oci-proxy:
    image: ${CATS_IMAGE:-cats:local}
    entrypoint: []
    command: ["uvicorn", "app.oci_proxy:app", "--host", "0.0.0.0", "--port", "5000", "--no-proxy-headers"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cats}@db:5432/${POSTGRES_DB:-cats}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CATS_CONFIG_ENCRYPTION_KEY: ${CATS_CONFIG_ENCRYPTION_KEY:?Set CATS_CONFIG_ENCRYPTION_KEY in .env}
      CATS_BOOTSTRAP_USERNAME: ${CATS_BOOTSTRAP_USERNAME:-admin}
      CATS_BOOTSTRAP_PASSWORD: ${CATS_BOOTSTRAP_PASSWORD:?Set CATS_BOOTSTRAP_PASSWORD in .env}
      CATS_ENV: ${CATS_ENV:-production}
      CATS_DEV_AUTH_BYPASS: "false"
      CATS_OCI_CACHE_DIR: /var/cache/cats-oci
      CATS_OCI_CACHE_MAX_BYTES: ${CATS_OCI_CACHE_MAX_BYTES:-10737418240}
      CATS_OCI_MAX_BLOB_BYTES: ${CATS_OCI_MAX_BLOB_BYTES:-4294967296}
      PYTHONDONTWRITEBYTECODE: "1"
      CATS_APPROVED_RELEASE_ROOT: /tmp/cats-remediation-jobs/approved-releases
    ports:
      # HTTPS must terminate at a trusted reverse proxy before external exposure.
      - "127.0.0.1:${CATS_OCI_PORT:-5000}:5000"
    volumes:
      - oci_proxy_cache:/var/cache/cats-oci
      - remediation_jobs:/tmp/cats-remediation-jobs:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s
volumes:
  oci_proxy_cache:
