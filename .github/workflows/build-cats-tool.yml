name: Build CATS tool image

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cats-tool

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify action process cleanup on Linux
        timeout-minutes: 3
        run: python3 portal/tests/test_action_supervisor.py

      - name: Verify scan archive cleanup on Linux
        timeout-minutes: 5
        run: |
          python3 -m venv "$RUNNER_TEMP/scan-lifecycle-tests"
          "$RUNNER_TEMP/scan-lifecycle-tests/bin/python" -m pip install 'pytest>=8,<10'
          "$RUNNER_TEMP/scan-lifecycle-tests/bin/python" -m pytest scanning-main/tests/test_image_archive_lifecycle.py -q

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the scanner layer first. The final published image contains the
      # scanner plus the portal and orchestration/API layer.
      - name: Build CATScan base
        run: |
          docker build --pull \
            --build-arg GRYPE_DB_REFRESH=${{ github.run_id }} \
            -f cats-scanner/Dockerfile \
            -t catscan-base:${{ github.sha }} \
            .

      - name: Build unified image
        run: |
          docker build \
            --build-arg CATSCAN_BASE_IMAGE=catscan-base:${{ github.sha }} \
            -f cats-image/Dockerfile.all-in-one \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" .

      - name: Smoke test
        timeout-minutes: 5
        run: |
          # The default entrypoint launches a long-running CATS role and does
          # not dispatch CLI arguments. Run these checks directly instead.
          docker run --rm --entrypoint catscan-version "$IMAGE:${{ github.sha }}"
          docker run --rm --entrypoint sh "$IMAGE:${{ github.sha }}" -c 'command -v cats && command -v cats-scan && command -v cats-patch'

      - name: Verify bundled backups without network access
        timeout-minutes: 5
        run: |
          docker run --rm --network none -e BACKUP_MODULE=/opt/backup/backup.py --entrypoint python3 \
            -v "$PWD/deploy/backup:/tests:ro" "$IMAGE:${{ github.sha }}" /tests/test_backup.py

      - name: Verify full image in replica mode
        timeout-minutes: 10
        run: python3 scripts/verify-replica-image.py --image "$IMAGE:${{ github.sha }}"

      - name: Push image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
