name: Build CATS tool image

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cats-tool

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the scanner layer first. The final published image contains the
      # scanner plus the portal and orchestration/API layer.
      - name: Build CATScan base
        run: |
          docker build --pull \
            --build-arg GRYPE_DB_REFRESH=${{ github.run_id }} \
            -f cats-scanner/Dockerfile \
            -t catscan-base:${{ github.sha }} \
            cats-scanner

      - name: Build unified image
        run: |
          docker build \
            --build-arg CATSCAN_BASE_IMAGE=catscan-base:${{ github.sha }} \
            -f cats-image/Dockerfile.all-in-one \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" .

      - name: Smoke test
        run: |
          docker run --rm "$IMAGE:${{ github.sha }}" catscan-version
          docker run --rm "$IMAGE:${{ github.sha }}" sh -c 'command -v cats && command -v cats-scan && command -v cats-patch'

      - name: Push image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
