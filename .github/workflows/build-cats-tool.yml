name: Build CATS tool image

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "runtime-agent/**"
      - "cats-image/**"
      - "cats-scanner/**"
      - "portal/app/runtime*.py"
      - "portal/tests/test_runtime*.py"
      - ".github/workflows/**"
      - ".github/scripts/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    uses: ./.github/workflows/test-and-package-cats.yml

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test-and-package-cats.yml
    with:
      publish: true
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-cats-main
      cancel-in-progress: false
