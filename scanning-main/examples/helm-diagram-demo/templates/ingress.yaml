{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "helm-diagram-demo.fullname" . }}
  labels:
    {{- include "helm-diagram-demo.labels" . | nindent 4 }}
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "helm-diagram-demo.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.servicePort }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "helm-diagram-demo.fullname" . }}-api
                port:
                  number: {{ .Values.api.servicePort }}
{{- end }}

