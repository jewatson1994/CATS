apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm-diagram-demo.fullname" . }}-frontend
  labels:
    {{- include "helm-diagram-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "helm-diagram-demo.name" . }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "helm-diagram-demo.name" . }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.images.frontend }}
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: {{ include "helm-diagram-demo.fullname" . }}-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm-diagram-demo.fullname" . }}-frontend
spec:
  selector:
    app.kubernetes.io/name: {{ include "helm-diagram-demo.name" . }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.servicePort }}
      targetPort: http

