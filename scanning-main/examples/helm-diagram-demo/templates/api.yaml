apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm-diagram-demo.fullname" . }}-api
  labels:
    {{- include "helm-diagram-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "helm-diagram-demo.name" . }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "helm-diagram-demo.name" . }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: {{ .Values.images.api }}
          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ include "helm-diagram-demo.fullname" . }}-config
            - secretRef:
                name: {{ include "helm-diagram-demo.fullname" . }}-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm-diagram-demo.fullname" . }}-api
spec:
  selector:
    app.kubernetes.io/name: {{ include "helm-diagram-demo.name" . }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.servicePort }}
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "helm-diagram-demo.fullname" . }}-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "helm-diagram-demo.fullname" . }}-api
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}

