apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "helm-diagram-demo.fullname" . }}-worker
  labels:
    {{- include "helm-diagram-demo.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "helm-diagram-demo.fullname" . }}-worker
  labels:
    {{- include "helm-diagram-demo.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "helm-diagram-demo.fullname" . }}-worker
roleRef:
  kind: Role
  name: {{ include "helm-diagram-demo.fullname" . }}-worker
  apiGroup: rbac.authorization.k8s.io

