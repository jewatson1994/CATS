apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm-diagram-demo.fullname" . }}-worker
  labels:
    {{- include "helm-diagram-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "helm-diagram-demo.name" . }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "helm-diagram-demo.name" . }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "helm-diagram-demo.fullname" . }}-worker
      containers:
        - name: worker
          image: {{ .Values.images.worker }}
          envFrom:
            - configMapRef:
                name: {{ include "helm-diagram-demo.fullname" . }}-config
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "helm-diagram-demo.fullname" . }}-cleanup
  labels:
    {{- include "helm-diagram-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "helm-diagram-demo.name" . }}
            app.kubernetes.io/component: cleanup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: {{ .Values.images.worker }}
              command: ["/bin/sh", "-c", "echo cleanup"]

