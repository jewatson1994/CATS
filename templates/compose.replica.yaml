# Standalone CATS replica — deploy separately from the main CATS stack.
# Portal, read-only OCI proxy, built-in Nginx HTTPS ingress, and a dedicated database.
# Uses the same prebuilt CATS image as main; Compose fixes its role to replica.
# No source checkout or build is needed on the replica host.
# Setup: templates/README.md (CATS replica); settings: templates/replica.env.example.
# External prerequisites: local OCI registry, DNS, and trusted TLS certificates.
# From the repository root, after preparing images and a private environment file:
# docker compose --env-file /secure/replica.env -f templates/compose.replica.yaml config --quiet
# docker compose --env-file /secure/replica.env -f templates/compose.replica.yaml up -d --wait --pull never
name: cats-replica

services:
  # 1. Portal — browse retained evidence and administer replica synchronization.
  portal:
    image: ${CATS_IMAGE:-${CATS_REPLICA_IMAGE:?Set CATS_IMAGE to the full CATS image}}
    entrypoint: []
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers", "--ssl-certfile", "/app/certs/tls.crt", "--ssl-keyfile", "/app/certs/tls.key"]
    # The OCI proxy below reuses these settings through *replica_environment.
    environment: &replica_environment
      # Fixed replica runtime settings.
      CATS_MODE: replica
      CATS_ENV: production
      CATS_DEV_AUTH_BYPASS: "false"
      CATS_DEPLOYMENT_VALIDATION_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"

      # Dedicated database and persistent credential encryption key.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cats}@db:5432/${POSTGRES_DB:-cats}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      CATS_CONFIG_ENCRYPTION_KEY: ${CATS_CONFIG_ENCRYPTION_KEY:?Set CATS_CONFIG_ENCRYPTION_KEY}

      # Local administrator and optional locally reachable OIDC provider.
      CATS_BOOTSTRAP_USERNAME: ${CATS_BOOTSTRAP_USERNAME:-admin}
      CATS_BOOTSTRAP_PASSWORD: ${CATS_BOOTSTRAP_PASSWORD:?Set CATS_BOOTSTRAP_PASSWORD}
      SESSION_COOKIE_SECURE: "true"
      CATS_PUBLIC_URL: https://${CATS_PORTAL_HOSTNAME:?Set CATS_PORTAL_HOSTNAME to your portal DNS name}
      CATS_OIDC_ENABLED: ${CATS_OIDC_ENABLED:-false}
      CATS_OIDC_ISSUER_URL: ${CATS_OIDC_ISSUER_URL:-}
      CATS_OIDC_CLIENT_ID: ${CATS_OIDC_CLIENT_ID:-}
      CATS_OIDC_CLIENT_SECRET: ${CATS_OIDC_CLIENT_SECRET:-}
      CATS_OIDC_REDIRECT_URI: ${CATS_OIDC_REDIRECT_URI:-}

      # Retained releases/evidence and the proxy's bounded blob cache.
      CATS_APPROVED_RELEASE_ROOT: /var/lib/cats/releases
      CATS_REPLICA_STORAGE: /var/lib/cats/replica
      CATS_OCI_CACHE_DIR: /var/cache/cats-oci
      CATS_OCI_CACHE_MAX_BYTES: ${CATS_OCI_CACHE_MAX_BYTES:-10737418240}

      # Discovery limits apply across a complete synchronization run.
      CATS_REPLICA_DISCOVERY_MAX_PAGES: ${CATS_REPLICA_DISCOVERY_MAX_PAGES:-100}
      CATS_REPLICA_DISCOVERY_MAX_ENTRIES: ${CATS_REPLICA_DISCOVERY_MAX_ENTRIES:-10000}
      CATS_REPLICA_DISCOVERY_MAX_RELEASES: ${CATS_REPLICA_DISCOVERY_MAX_RELEASES:-10000}
    volumes:
      - replica_evidence:/var/lib/cats
      - type: bind
        source: ${CATS_PORTAL_CERT_DIR:-/opt/cats/certs/portal}
        target: /app/certs
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "--noproxy", "*", "--cacert", "/app/certs/tls.crt", "--resolve", "${CATS_PORTAL_HOSTNAME:?Set CATS_PORTAL_HOSTNAME to your portal DNS name}:8000:127.0.0.1", "https://${CATS_PORTAL_HOSTNAME:?Set CATS_PORTAL_HOSTNAME to your portal DNS name}:8000/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # 2. OCI access — enforce release approval and serve verified local content.
  oci-proxy:
    image: ${CATS_IMAGE:-${CATS_REPLICA_IMAGE:?Set CATS_IMAGE to the full CATS image}}
    entrypoint: []
    command: ["uvicorn", "app.oci_proxy:app", "--host", "0.0.0.0", "--port", "5000", "--no-proxy-headers", "--ssl-certfile", "/app/oci-certs/tls.crt", "--ssl-keyfile", "/app/oci-certs/tls.key"]
    environment: *replica_environment
    volumes:
      # Evidence is read-only here; downloaded blobs use a separate cache.
      - replica_evidence:/var/lib/cats:ro
      - replica_cache:/var/cache/cats-oci
      - type: bind
        source: ${CATS_OCI_CERT_DIR:-/opt/cats/certs/oci-proxy}
        target: /app/oci-certs
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
      portal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "--noproxy", "*", "--cacert", "/app/oci-certs/tls.crt", "--resolve", "${CATS_OCI_HOSTNAME:?Set CATS_OCI_HOSTNAME to your registry DNS name}:5000:127.0.0.1", "https://${CATS_OCI_HOSTNAME:?Set CATS_OCI_HOSTNAME to your registry DNS name}:5000/healthz"]
      interval: 15s
      timeout: 6s
      retries: 6
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # 3. HTTPS ingress — route both DNS names on port 443 without decrypting traffic.
  nginx:
    # Pinned official stable-alpine image, including stream + ssl_preread support.
    image: ${CATS_NGINX_IMAGE:-nginx:stable-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949}
    # Shell and Nginx variables use $$ so Compose leaves them for the container.
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        # Fail before interpolation if a value is not a plain DNS hostname.
        for hostname in "$${CATS_PORTAL_HOSTNAME:?Set CATS_PORTAL_HOSTNAME}" "$${CATS_OCI_HOSTNAME:?Set CATS_OCI_HOSTNAME}"; do
            case "$$hostname" in
                *[!A-Za-z0-9.-]*)
                    echo "CATS routing requires plain DNS hostnames without schemes, paths or ports." >&2
                    exit 1
                    ;;
            esac
            if ! printf '%s\n' "$$hostname" | grep -Eq '^([A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?\.)+[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?$$'; then
                echo "CATS routing requires plain DNS hostnames without schemes, paths or ports." >&2
                exit 1
            fi
        done

        if [ "$$(printf '%s' "$$CATS_PORTAL_HOSTNAME" | tr '[:upper:]' '[:lower:]')" = "$$(printf '%s' "$$CATS_OCI_HOSTNAME" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "The portal and OCI proxy must use different hostnames." >&2
            exit 1
        fi

        # Generate the embedded config in the writable tmpfs.
        cat > /tmp/cats.conf.template <<'CATS_NGINX_CONFIG'
        # Match the Compose CPU allocation and bounded PID/memory limits.
        worker_processes 1;
        pid /tmp/nginx.pid;
        error_log /dev/stderr warn;

        events {
            worker_connections 1024;
        }

        stream {
            # Resolve container addresses again after a backend is recreated.
            resolver 127.0.0.11 valid=10s ipv6=off;

            # Read the TLS hostname without decrypting requests or handling credentials.
            # Unrecognized names (including IP-only requests) have no public backend.
            map $$ssl_preread_server_name $$cats_backend {
                default 127.0.0.1:9;
                $${CATS_PORTAL_HOSTNAME} portal:8000;
                $${CATS_OCI_HOSTNAME} oci-proxy:5000;
            }

            server {
                listen 8443;
                ssl_preread on;
                preread_timeout 10s;
                proxy_connect_timeout 5s;
                # Idle timeout, not a limit on total image download duration.
                proxy_timeout 600s;
                proxy_pass $$cats_backend;
            }
        }
        CATS_NGINX_CONFIG

        # Substitute only deployment settings; retain Nginx's own $$variables.
        envsubst '$${CATS_PORTAL_HOSTNAME} $${CATS_OCI_HOSTNAME}' \
            < /tmp/cats.conf.template > /tmp/nginx.conf
        nginx -t -q -c /tmp/nginx.conf
        exec nginx -c /tmp/nginx.conf -g 'daemon off;'
    environment:
      CATS_PORTAL_HOSTNAME: ${CATS_PORTAL_HOSTNAME:?Set CATS_PORTAL_HOSTNAME to your portal DNS name}
      CATS_OCI_HOSTNAME: ${CATS_OCI_HOSTNAME:?Set CATS_OCI_HOSTNAME to your registry DNS name}
    ports:
      - "443:8443"
    depends_on:
      portal:
        condition: service_healthy
      oci-proxy:
        condition: service_healthy
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q -c /tmp/nginx.conf && nc -z -w 2 127.0.0.1 8443"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 4. Database — local accounts, replica state, and authorization records.
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cats}
      POSTGRES_USER: ${POSTGRES_USER:-cats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - replica_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

# Persistent storage belongs to the cats-replica project, separate from main CATS.
# Preserve these volumes and the encryption key during upgrades.
volumes:
  # PostgreSQL data.
  replica_db:
  # Imported releases, evidence, and replica files.
  replica_evidence:
  # Verified OCI blob cache.
  replica_cache:
