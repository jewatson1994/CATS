name: cats

# Main CATS deployment template. See templates/README.md.
#
# Run from the repository root with:
#
#   docker compose --env-file /secure/cats.env -f templates/compose.main.yaml up -d --wait
#
# Authentication:
#   - CATS provides local authentication by default.
#   - External identity providers may be configured through OIDC.
#   - CATS does NOT bundle or operate an identity provider.
#
# Image:
#   - CATS_IMAGE may be used to select the CATS image/version.
#   - Example:
#       CATS_IMAGE=cats:YOUR_VERSION
#
#   - The rebuild utility sets CATS_IMAGE automatically before
#     recreating the portal and patch-worker.

services:

  # =========================================================
  # PostgreSQL
  # =========================================================

  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cats}
      POSTGRES_USER: ${POSTGRES_USER:-cats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    restart: unless-stopped


  # =========================================================
  # Patch Worker
  # =========================================================

  patch-worker:
    image: ${CATS_IMAGE:?Set CATS_IMAGE to the built release image}
    entrypoint: []

    command:
      [
        "uvicorn",
        "app.patch_service:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8010"
      ]

    environment:
      CATS_PATCH_JOB_ROOT: /tmp/cats-patch-jobs

      CATS_PATCH_WORKER_TOKEN: ${CATS_PATCH_WORKER_TOKEN:?Set CATS_PATCH_WORKER_TOKEN in .env}

      CATS_CONFIG_ENCRYPTION_KEY: ${CATS_CONFIG_ENCRYPTION_KEY:?Set CATS_CONFIG_ENCRYPTION_KEY in .env}

      CATS_PATCH_COMMAND_TIMEOUT: ${CATS_PATCH_COMMAND_TIMEOUT:-1800}

      CATS_COPA_TIMEOUT: ${CATS_COPA_TIMEOUT:-30m}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - patch_jobs:/tmp/cats-patch-jobs

    healthcheck:
      test:
        [
          "CMD",
          "/opt/cats-venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/openapi.json', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

    restart: unless-stopped


  # =========================================================
  # CATS Portal
  # =========================================================

  # Dedicated daemonless scanner: no database credentials or Docker socket.
  scan-worker:
    image: ${CATS_IMAGE:?Set CATS_IMAGE to the built release image}
    entrypoint: []
    command: ["/opt/cats-venv/bin/python", "-m", "app.scan_worker"]
    networks: [scan_control, scan_egress]
    # Control broker retains only the capabilities needed to drop scanner identity.
    # Scanner subprocesses run as 10002 without capabilities or control credentials.
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN]
    security_opt:
      - no-new-privileges:true
    cpus: ${CATS_SCAN_CPUS:-2}
    mem_limit: ${CATS_SCAN_MEMORY:-4g}
    pids_limit: ${CATS_SCAN_PIDS:-256}
    stop_grace_period: 30s
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      HOME: /var/lib/cats-scan
      TMPDIR: /var/lib/cats-scan/tmp
      CATS_SCAN_SCANNER_UID: "10002"
      CATS_SCAN_SCANNER_GID: "10002"
      CATS_PUBLIC_MAX_CHART_BYTES: ${CATS_PUBLIC_MAX_CHART_BYTES:-536870912}
      CATS_PUBLIC_MAX_CHART_EXPANDED_BYTES: ${CATS_PUBLIC_MAX_CHART_EXPANDED_BYTES:-1073741824}
      CATS_PUBLIC_MAX_CHART_MEMBERS: ${CATS_PUBLIC_MAX_CHART_MEMBERS:-10000}
      CATS_PUBLIC_HELM_PULL_TIMEOUT: ${CATS_PUBLIC_HELM_PULL_TIMEOUT:-180}
      CATS_PUBLIC_HELM_TEMP_RESERVE_BYTES: ${CATS_PUBLIC_HELM_TEMP_RESERVE_BYTES:-0}
      HELM_DISCOVERY_MAX_ARCHIVE_BYTES: ${HELM_DISCOVERY_MAX_ARCHIVE_BYTES:-536870912}
      HELM_DISCOVERY_MAX_ARCHIVE_EXPANDED_BYTES: ${HELM_DISCOVERY_MAX_ARCHIVE_EXPANDED_BYTES:-1073741824}
      HELM_DISCOVERY_MAX_ARCHIVE_MEMBERS: ${HELM_DISCOVERY_MAX_ARCHIVE_MEMBERS:-10000}
      CATS_SERVICE_DEFINITION_MAX_BYTES: ${CATS_SERVICE_DEFINITION_MAX_BYTES:-10485760}
      CATS_SERVICE_DEFINITION_MAX_NODES: ${CATS_SERVICE_DEFINITION_MAX_NODES:-200000}
      CATS_SERVICE_DEFINITION_MAX_DEPTH: ${CATS_SERVICE_DEFINITION_MAX_DEPTH:-64}
      CATS_SERVICE_DEFINITION_MAX_STRING_BYTES: ${CATS_SERVICE_DEFINITION_MAX_STRING_BYTES:-1048576}
      CATS_SERVICE_DEFINITION_MAX_COMPONENTS: ${CATS_SERVICE_DEFINITION_MAX_COMPONENTS:-1000}
      CATS_SCAN_WORKER_TOKEN: ${CATS_SCAN_WORKER_TOKEN:?Set CATS_SCAN_WORKER_TOKEN in .env}
      CATS_SCAN_WORKER_ID: ${CATS_SCAN_WORKER_ID:-scan-worker}
      CATS_SCAN_PORTAL_URL: http://portal-control:8001
      CATS_SCAN_JOB_ROOT: /var/lib/cats-scan
      CATS_SCAN_CONCURRENCY: ${CATS_SCAN_CONCURRENCY:-2}
      CATS_SCAN_LEASE_SECONDS: ${CATS_SCAN_LEASE_SECONDS:-90}
      CATS_SCAN_JOB_TIMEOUT: ${CATS_SCAN_JOB_TIMEOUT:-3600}
      CATS_SCAN_DISK_BYTES: ${CATS_SCAN_DISK_BYTES:-21474836480}
      CATS_SCANNER_RUNNER: ${CATS_SCANNER_RUNNER:-/usr/local/bin/cats-scan}
      CATS_IMAGE_SOURCE: daemonless
      DOCKER_CONFIG: /run/cats-registry-auth
      GRYPE_DB_CACHE_DIR: /var/lib/cats-scan/cache/grype
      GRYPE_DB_METADATA: /var/lib/cats-scan/cache/grype/latest.json
      TRIVY_CACHE_DIR: /var/lib/cats-scan/cache/trivy
      HELM_CACHE_HOME: /var/lib/cats-scan/cache/helm
      HELM_CONFIG_HOME: /var/lib/cats-scan/config/helm
      HELM_DATA_HOME: /var/lib/cats-scan/data/helm
      HELM_ALLOW_NETWORK: ${HELM_ALLOW_NETWORK:-false}
      TRIVY_IMAGE_CONFIG_SCAN_ENABLED: ${TRIVY_IMAGE_CONFIG_SCAN_ENABLED:-true}
      DOCKLE_IMAGE_CONFIG_SCAN_ENABLED: ${DOCKLE_IMAGE_CONFIG_SCAN_ENABLED:-true}
    volumes:
      - scan_jobs:/var/lib/cats-scan
      - type: bind
        source: ${CATS_SCAN_REGISTRY_AUTH_SOURCE:-./scan-registry-auth}
        target: /run/cats-registry-auth
        read_only: true
        bind:
          create_host_path: false
      - security_policy_data:/app/policy:ro
      - security_grype_db:/opt/catscan/grype-db:ro
      - security_trivy_db:/opt/catscan/trivy-cache:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${CATS_SCAN_TMP_BYTES:-536870912},mode=1777
    depends_on:
      portal-control:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/cats-venv/bin/python", "-m", "app.scan_worker", "--readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  portal:
    image: ${CATS_IMAGE:?Set CATS_IMAGE to the built release image}
    networks: [default, scan_control]

    environment: &portal_environment

      # -------------------------------------------------------
      # Database
      # -------------------------------------------------------

      # Keep the password out of the URI.
      # Psycopg reads PGPASSWORD directly, including passwords
      # containing URI-reserved characters.

      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cats}@db:5432/${POSTGRES_DB:-cats}

      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}


      # -------------------------------------------------------
      # Local Authentication
      # -------------------------------------------------------

      CATS_BOOTSTRAP_USERNAME: ${CATS_BOOTSTRAP_USERNAME:-admin}

      CATS_BOOTSTRAP_PASSWORD: ${CATS_BOOTSTRAP_PASSWORD:?Set CATS_BOOTSTRAP_PASSWORD in .env}

      CATS_ENV: ${CATS_ENV:-production}

      CATS_DEV_AUTH_BYPASS: ${CATS_DEV_AUTH_BYPASS:-false}

      CATS_DEV_USER: ${CATS_DEV_USER:-admin}

      # Supported identity modes include local authentication
      # and externally configured OIDC.
      #
      # CATS does not require or bundle Keycloak.

      CATS_IDENTITY_MODE: ${CATS_IDENTITY_MODE:-local}


      # -------------------------------------------------------
      # Application Security
      # -------------------------------------------------------

      CATS_CONFIG_ENCRYPTION_KEY: ${CATS_CONFIG_ENCRYPTION_KEY:?Set CATS_CONFIG_ENCRYPTION_KEY in .env}

      CATS_MANAGED_VALIDATOR_RELEASE_DIR: /opt/cats/managed-validator-release

      PIPELINE_API_TOKEN: ${PIPELINE_API_TOKEN:?Set PIPELINE_API_TOKEN in .env}

      ALLOW_SERVICE_DELETE: ${ALLOW_SERVICE_DELETE:-false}

      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}

      SESSION_HOURS: ${SESSION_HOURS:-8}


      # -------------------------------------------------------
      # Patch Worker
      # -------------------------------------------------------

      CATS_PATCH_WORKER_URL: http://patch-worker:8010

      CATS_PATCH_WORKER_TOKEN: ${CATS_PATCH_WORKER_TOKEN:?Set CATS_PATCH_WORKER_TOKEN in .env}

      CATS_PATCH_JOB_ROOT: /tmp/cats-patch-jobs

      CATS_PATCH_JOB_TIMEOUT: ${CATS_PATCH_JOB_TIMEOUT:-3600}

      CATS_PATCH_COMMAND_TIMEOUT: ${CATS_PATCH_COMMAND_TIMEOUT:-1800}

      CATS_COPA_TIMEOUT: ${CATS_COPA_TIMEOUT:-30m}


      # -------------------------------------------------------
      # Scanner
      # -------------------------------------------------------

      CATS_SCAN_WORKER_TOKEN: ${CATS_SCAN_WORKER_TOKEN:?Set CATS_SCAN_WORKER_TOKEN in .env}
      CATS_SCAN_WORKER_ID: ${CATS_SCAN_WORKER_ID:-scan-worker}
      CATS_SCAN_LEASE_SECONDS: ${CATS_SCAN_LEASE_SECONDS:-90}
      CATS_SCAN_JOB_TIMEOUT: ${CATS_SCAN_JOB_TIMEOUT:-3600}
      CATS_SCAN_WORKER_CREDENTIALS: ${CATS_SCAN_WORKER_CREDENTIALS:-}
      CATS_SCAN_QUEUE_CAPACITY: ${CATS_SCAN_QUEUE_CAPACITY:-100}
      CATS_SCAN_ANONYMOUS_QUEUE_CAPACITY: ${CATS_SCAN_ANONYMOUS_QUEUE_CAPACITY:-10}
      CATS_SCAN_PREPARATION_TTL_SECONDS: ${CATS_SCAN_PREPARATION_TTL_SECONDS:-900}
      CATS_SCAN_RETENTION_DAYS: ${CATS_SCAN_RETENTION_DAYS:-30}
      CATS_SCAN_CLEANUP_BATCH_SIZE: ${CATS_SCAN_CLEANUP_BATCH_SIZE:-20}
      CATS_SCAN_MAX_ATTEMPTS: ${CATS_SCAN_MAX_ATTEMPTS:-3}
      CATS_SCAN_DISK_BYTES: ${CATS_SCAN_DISK_BYTES:-21474836480}
      CATS_SCANNER_RUNNER: ${CATS_SCANNER_RUNNER:-/usr/local/bin/cats-scan}

      CATS_PUBLIC_JOB_ROOT: /tmp/cats-public-jobs

      CATS_PUBLIC_JOB_TIMEOUT: ${CATS_PUBLIC_JOB_TIMEOUT:-3600}
      CATS_PUBLIC_MAX_CHART_BYTES: ${CATS_PUBLIC_MAX_CHART_BYTES:-536870912}
      CATS_UPLOAD_REQUEST_MAX_BYTES: ${CATS_UPLOAD_REQUEST_MAX_BYTES:-1073741824}
      CATS_PUBLIC_MAX_CHART_EXPANDED_BYTES: ${CATS_PUBLIC_MAX_CHART_EXPANDED_BYTES:-1073741824}
      CATS_PUBLIC_MAX_CHART_MEMBERS: ${CATS_PUBLIC_MAX_CHART_MEMBERS:-10000}
      CATS_PUBLIC_HELM_PULL_TIMEOUT: ${CATS_PUBLIC_HELM_PULL_TIMEOUT:-180}
      CATS_PUBLIC_HELM_TEMP_RESERVE_BYTES: ${CATS_PUBLIC_HELM_TEMP_RESERVE_BYTES:-0}
      CATS_SERVICE_DEFINITION_MAX_BYTES: ${CATS_SERVICE_DEFINITION_MAX_BYTES:-10485760}
      CATS_SERVICE_DEFINITION_MAX_NODES: ${CATS_SERVICE_DEFINITION_MAX_NODES:-200000}
      CATS_SERVICE_DEFINITION_MAX_DEPTH: ${CATS_SERVICE_DEFINITION_MAX_DEPTH:-64}
      CATS_SERVICE_DEFINITION_MAX_STRING_BYTES: ${CATS_SERVICE_DEFINITION_MAX_STRING_BYTES:-1048576}
      CATS_SERVICE_DEFINITION_MAX_COMPONENTS: ${CATS_SERVICE_DEFINITION_MAX_COMPONENTS:-1000}
      CATS_WORKBOOK_MAX_BYTES: ${CATS_WORKBOOK_MAX_BYTES:-20971520}
      CATS_BUNDLE_MAX_BYTES: ${CATS_BUNDLE_MAX_BYTES:-104857600}
      CATS_BUNDLE_MAX_RECORDS: ${CATS_BUNDLE_MAX_RECORDS:-100000}
      CATS_BUNDLE_MAX_JSON_NODES: ${CATS_BUNDLE_MAX_JSON_NODES:-2000000}
      CATS_PREVIEW_CLEANUP_INTERVAL_SECONDS: ${CATS_PREVIEW_CLEANUP_INTERVAL_SECONDS:-300}
      CATS_PREVIEW_CLEANUP_BATCH_SIZE: ${CATS_PREVIEW_CLEANUP_BATCH_SIZE:-100}
      CATS_ARTIFACT_SOURCE_MAX_BYTES: ${CATS_ARTIFACT_SOURCE_MAX_BYTES:-104857600}
      HELM_DISCOVERY_MAX_ARCHIVE_BYTES: ${HELM_DISCOVERY_MAX_ARCHIVE_BYTES:-536870912}
      HELM_DISCOVERY_MAX_ARCHIVE_EXPANDED_BYTES: ${HELM_DISCOVERY_MAX_ARCHIVE_EXPANDED_BYTES:-1073741824}
      HELM_DISCOVERY_MAX_ARCHIVE_MEMBERS: ${HELM_DISCOVERY_MAX_ARCHIVE_MEMBERS:-10000}
      HELM_ALLOW_NETWORK: ${HELM_ALLOW_NETWORK:-false}


      # -------------------------------------------------------
      # Deployment Validation
      # -------------------------------------------------------

      CATS_DEPLOYMENT_VALIDATION_ENABLED: ${CATS_DEPLOYMENT_VALIDATION_ENABLED:-false}

      CATS_PIPELINE_MAX_REQUEST_BYTES: ${CATS_PIPELINE_MAX_REQUEST_BYTES:-16777216}

      CATS_DEPLOYMENT_VALIDATION_WORKERS: ${CATS_DEPLOYMENT_VALIDATION_WORKERS:-1}

      CATS_DEPLOYMENT_CLUSTER_PREFIX: ${CATS_DEPLOYMENT_CLUSTER_PREFIX:-cats-validation}

      CATS_DEPLOYMENT_NAMESPACE_PREFIX: ${CATS_DEPLOYMENT_NAMESPACE_PREFIX:-cats-validation}


      # -------------------------------------------------------
      # kind
      # -------------------------------------------------------

      CATS_DEPLOYMENT_KIND_NODE_IMAGE: ${CATS_DEPLOYMENT_KIND_NODE_IMAGE:-kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5}

      # Optional offline kind node image archive.
      CATS_DEPLOYMENT_KIND_NODE_ARCHIVE: ${CATS_DEPLOYMENT_KIND_NODE_ARCHIVE:-}

      # The CATS portal itself runs inside Docker.
      # kind exposes its Kubernetes API through the Docker host.

      CATS_DEPLOYMENT_API_HOST: ${CATS_DEPLOYMENT_API_HOST:-host.docker.internal}

      CATS_DEPLOYMENT_API_ADDRESS: ${CATS_DEPLOYMENT_API_ADDRESS:-127.0.0.1}


      # -------------------------------------------------------
      # Deployment Image Behavior
      # -------------------------------------------------------

      CATS_DEPLOYMENT_REQUIRE_LOCAL_IMAGES: ${CATS_DEPLOYMENT_REQUIRE_LOCAL_IMAGES:-true}
      CATS_DEPLOYMENT_LOAD_BALANCER_PROVIDER_ENABLED: ${CATS_DEPLOYMENT_LOAD_BALANCER_PROVIDER_ENABLED:-true}
      CATS_DEPLOYMENT_LOAD_BALANCER_BUNDLE_DIR: ${CATS_DEPLOYMENT_LOAD_BALANCER_BUNDLE_DIR:-/opt/cats/validation/loadbalancer}
      CATS_DEPLOYMENT_LOAD_BALANCER_TIMEOUT: ${CATS_DEPLOYMENT_LOAD_BALANCER_TIMEOUT:-90}
      CATS_DEPLOYMENT_INGRESS_CONTROLLER_ENABLED: ${CATS_DEPLOYMENT_INGRESS_CONTROLLER_ENABLED:-true}
      CATS_DEPLOYMENT_INGRESS_BUNDLE_DIR: ${CATS_DEPLOYMENT_INGRESS_BUNDLE_DIR:-/opt/cats/validation/ingress}
      CATS_DEPLOYMENT_INGRESS_TIMEOUT: ${CATS_DEPLOYMENT_INGRESS_TIMEOUT:-90}


      # -------------------------------------------------------
      # Deployment Validation Timeouts
      # -------------------------------------------------------

      CATS_DEPLOYMENT_CREATE_TIMEOUT: ${CATS_DEPLOYMENT_CREATE_TIMEOUT:-180}

      CATS_DEPLOYMENT_INSTALL_TIMEOUT: ${CATS_DEPLOYMENT_INSTALL_TIMEOUT:-180}

      CATS_DEPLOYMENT_READINESS_TIMEOUT: ${CATS_DEPLOYMENT_READINESS_TIMEOUT:-600}

      CATS_DEPLOYMENT_COLLECTION_TIMEOUT: ${CATS_DEPLOYMENT_COLLECTION_TIMEOUT:-60}

      CATS_DEPLOYMENT_CLEANUP_TIMEOUT: ${CATS_DEPLOYMENT_CLEANUP_TIMEOUT:-60}

      CATS_DEPLOYMENT_TOTAL_TIMEOUT: ${CATS_DEPLOYMENT_TOTAL_TIMEOUT:-600}

      CATS_INGEST_MAX_SOURCE_FILES: ${CATS_INGEST_MAX_SOURCE_FILES:-5000}

      CATS_INGEST_MAX_SOURCE_BYTES: ${CATS_INGEST_MAX_SOURCE_BYTES:-104857600}


      # -------------------------------------------------------
      # Deployment Validation Safety / Capacity
      # -------------------------------------------------------

      CATS_DEPLOYMENT_MAX_PODS: ${CATS_DEPLOYMENT_MAX_PODS:-50}

      CATS_DEPLOYMENT_MAX_OBJECTS: ${CATS_DEPLOYMENT_MAX_OBJECTS:-500}



      CATS_DEPLOYMENT_MAX_SOURCE_BYTES: ${CATS_DEPLOYMENT_MAX_SOURCE_BYTES:-104857600}

      CATS_DEPLOYMENT_MAX_RENDER_BYTES: ${CATS_DEPLOYMENT_MAX_RENDER_BYTES:-20971520}

      CATS_DEPLOYMENT_MAX_COMMAND_OUTPUT_BYTES: ${CATS_DEPLOYMENT_MAX_COMMAND_OUTPUT_BYTES:-25165824}


      # -------------------------------------------------------
      # Deployment Resource Configuration
      #
      # NOTE:
      # These are intentionally retained for now.
      #
      # Enforcement and evidence depend on the validation host.
      # Review the validation result for effective resource controls.
      # -------------------------------------------------------

      CATS_DEPLOYMENT_MAX_CPU: ${CATS_DEPLOYMENT_MAX_CPU:-8}

      CATS_DEPLOYMENT_MAX_MEMORY: ${CATS_DEPLOYMENT_MAX_MEMORY:-16Gi}

      CATS_DEPLOYMENT_MAX_STORAGE: ${CATS_DEPLOYMENT_MAX_STORAGE:-20Gi}

      CATS_DEPLOYMENT_NODE_CPUS: ${CATS_DEPLOYMENT_NODE_CPUS:-4}

      CATS_DEPLOYMENT_NODE_MEMORY: ${CATS_DEPLOYMENT_NODE_MEMORY:-8g}

      CATS_DEPLOYMENT_NODE_PIDS: ${CATS_DEPLOYMENT_NODE_PIDS:-2048}


      # -------------------------------------------------------
      # Deployment Networking
      # -------------------------------------------------------

      CATS_DEPLOYMENT_ALLOW_NETWORK_EGRESS: ${CATS_DEPLOYMENT_ALLOW_NETWORK_EGRESS:-false}


      # -------------------------------------------------------
      # Scanner Configuration
      # -------------------------------------------------------

      TRIVY_IMAGE_CONFIG_SCAN_ENABLED: ${TRIVY_IMAGE_CONFIG_SCAN_ENABLED:-true}

      DOCKLE_IMAGE_CONFIG_SCAN_ENABLED: ${DOCKLE_IMAGE_CONFIG_SCAN_ENABLED:-true}


      # =======================================================
      # External OIDC Configuration
      # =======================================================
      #
      # CATS is an OIDC client / relying party.
      #
      # The identity provider is external to CATS and may be:
      #
      #   - Keycloak
      #   - Microsoft Entra ID
      #   - Okta
      #   - another compatible OIDC provider
      #
      # CATS does NOT deploy an identity provider.
      # =======================================================

      CATS_OIDC_ALLOW_INSECURE_HTTP: ${CATS_OIDC_ALLOW_INSECURE_HTTP:-false}

      CATS_OIDC_ISSUER_URL: ${CATS_OIDC_ISSUER_URL:-}

      CATS_OIDC_BROWSER_ISSUER_URL: ${CATS_OIDC_BROWSER_ISSUER_URL:-}

      CATS_OIDC_CLIENT_ID: ${CATS_OIDC_CLIENT_ID:-}

      CATS_OIDC_CLIENT_SECRET: ${CATS_OIDC_CLIENT_SECRET:-}

      CATS_OIDC_REDIRECT_URI: ${CATS_OIDC_REDIRECT_URI:-}

      CATS_OIDC_POST_LOGOUT_REDIRECT_URI: ${CATS_OIDC_POST_LOGOUT_REDIRECT_URI:-}

      CATS_OIDC_SCOPES: ${CATS_OIDC_SCOPES:-openid profile email groups}

      CATS_OIDC_GROUPS_CLAIM: ${CATS_OIDC_GROUPS_CLAIM:-groups}

      CATS_OIDC_ROLES_CLAIM: ${CATS_OIDC_ROLES_CLAIM:-realm_access.roles}

      CATS_OIDC_ROLE_MAP: ${CATS_OIDC_ROLE_MAP:-{}}

      CATS_OIDC_GROUP_ROLE_MAP: ${CATS_OIDC_GROUP_ROLE_MAP:-{}}

      CATS_OIDC_DEFAULT_ROLE: ${CATS_OIDC_DEFAULT_ROLE:-}

      CATS_OIDC_GROUP_DEFAULT_ROLE: ${CATS_OIDC_GROUP_DEFAULT_ROLE:-Service Manager}

      CATS_OIDC_AUTO_PROVISION: ${CATS_OIDC_AUTO_PROVISION:-true}

      CATS_OIDC_AUTO_PROVISION_GROUPS: ${CATS_OIDC_AUTO_PROVISION_GROUPS:-false}


    # ---------------------------------------------------------
    # Volumes
    # ---------------------------------------------------------

    volumes: &portal_volumes
      # Required by current CATS Docker/kind/scanning operations.
      - type: bind
        source: ${CATS_MANAGED_VALIDATOR_RELEASE_SOURCE:?Set an absolute path to the prepared validator release directory}
        target: /opt/cats/managed-validator-release
        read_only: true

      - patch_jobs:/tmp/cats-patch-jobs

      - public_jobs:/tmp/cats-public-jobs
      - validator_payloads:/app/data/validator-payloads
      - remediation_jobs:/tmp/cats-remediation-jobs
      - security_policy_data:/app/policy
      - security_grype_db:/opt/catscan/grype-db
      - security_trivy_db:/opt/catscan/trivy-cache


    # ---------------------------------------------------------
    # Docker Host Access
    # ---------------------------------------------------------

    extra_hosts:
      - "host.docker.internal:host-gateway"


    # ---------------------------------------------------------
    # Portal Port
    # ---------------------------------------------------------

    ports:
      - "${CATS_PORT:-8080}:8000"


    # ---------------------------------------------------------
    # Dependencies
    # ---------------------------------------------------------

    depends_on:
      db:
        condition: service_healthy

      patch-worker:
        condition: service_healthy


    # ---------------------------------------------------------
    # Health Check
    # ---------------------------------------------------------

    healthcheck:
      test:
        [
          "CMD",
          "/opt/cats-venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s


    restart: unless-stopped


  # Dedicated internal listener: worker protocol never uses the published Portal port.
  portal-control:
    image: ${CATS_IMAGE:?Set CATS_IMAGE to the built release image}
    entrypoint: []
    command: ["uvicorn", "app.scan_control:app", "--host", "0.0.0.0", "--port", "8001"]
    networks: [default, scan_control]
    environment: *portal_environment
    volumes: *portal_volumes
    depends_on:
      db:
        condition: service_healthy
      portal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/cats-venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped



# ===========================================================
# Persistent Volumes
# ===========================================================

volumes:

  postgres_data:

  patch_jobs:

  scan_jobs:

  public_jobs:

  remediation_jobs:

  security_policy_data:

  security_grype_db:

  security_trivy_db:

  validator_payloads:

networks:
  default:
  scan_control:
    internal: true
  scan_egress:
